<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="On My Gaydar is a curated collection of queer events in London where users can search by date, tags, and location using a map view.">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
    
    <!-- Additional Security Meta Tags -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="On My Gaydar">
    <meta name="theme-color" content="#000000">
    <meta property="og:title" content="On My Gaydar - London Queer Events">
    <meta property="og:description" content="The best local queer events in London, updated daily.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://onmygaydar.com">
    <meta property="og:image" content="https://onmygaydar.com/images/artopia.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="On My Gaydar - London Queer Events">
    <meta name="twitter:description" content="The best local queer events in London, updated daily.">
    
    <!-- Favicon - Add when you have one -->
    <!-- <link rel="icon" type="image/x-icon" href="/favicon.ico"> -->

    <!-- Mapbox CSS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Roboto font -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3Y7XDQTWMR"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3Y7XDQTWMR');
    </script>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        <div class="sidebar">
            <div class="header">
                <h1>On My Gaydar</h1>
                <h5>The best local queer events, updated daily. <a href="https://mailchi.mp/54e006ea8469/gaydar-newsletter-sign-up" target="_blank" class="newsletter-link">Sign up for weekly roundups</a></h5>

                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn tags-filter-btn" onclick="toggleTagFilter()">🔍 Tags</button>
                    <button class="filter-btn" data-filter="this-week">This Week</button>
                    <button class="filter-btn" data-filter="today">Today</button>
                    <button class="filter-btn" data-filter="party">Party</button>
                    <button class="filter-btn" data-filter="social">Social</button>
                    <button class="filter-btn" data-filter="workshop">Workshop</button>
                </div>
                <div class="tag-filter-dropdown-container"></div>
            </div>
            <div class="events-list" id="events-list">
                <!-- Events will be populated here -->
            </div>
        </div>
    </div>

    <!-- Mapbox JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    
    <!-- Config -->
    <script src="js/config.js"></script>
    
    <!-- Events Data -->
    <script src="js/events.js"></script>
    
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
