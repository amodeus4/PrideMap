<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://qro-wd.com/">
    <title>QROWD</title>
    <meta property="og:site_name" content="Qrowd">
    <meta property="og:title" content="Qrowd">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Qrowd is a curated collection of queer events in London where users can search by date, tags, and location using a map view.">
    <meta name="keywords" content="queer events, london, pride events, lgbtq+ events, lgbtq+ community, local queer scene, queer parties, queer events in london, lesbian events, gay events, entertainment">
    <!-- Mapbox CSS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Roboto font -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="logo.svg" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3Y7XDQTWMR"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3Y7XDQTWMR');
    </script>
</head>
<body>
    <div id="loading-overlay" aria-live="polite" role="status">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Loading...</div>
        </div>
    </div>
    <div class="container">
        <div id="map"></div>
        <div class="sidebar">
            <div class="header">
                <h1>QROWD</h1>
                <!-- newsletter <h5>The best local queer events, updated daily. <a href="https://mailchi.mp/54e006ea8469/gaydar-newsletter-sign-up" target="_blank" class="newsletter-link">Sign up for weekly roundups</a></h5>-->
                <div class="social-links" aria-label="Follow QROWD on social media">
                    <a class="social-link instagram" href="https://www.instagram.com/qrowd.ldn/?hl=en" target="_blank" rel="noopener noreferrer" aria-label="QROWD on Instagram">
                        <img class="social-icon-img" src="/instagram.png" alt="" aria-hidden="true" />
                        <span class="sr-only">Instagram</span>
                    </a>
                </div>

                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn tags-filter-btn" onclick="toggleTagFilter()">🔍 Tags</button>
                    <button class="filter-btn" data-filter="this-week">This Week</button>
                    <button class="filter-btn" data-filter="today">Today</button>
                    <button class="filter-btn" data-filter="party">Party</button>
                    <button class="filter-btn" data-filter="social">Social</button>
                    <button class="filter-btn" data-filter="workshop">Workshop</button>
                </div>
                <div class="tag-filter-dropdown-container"></div>
            </div>
            <div class="events-list" id="events-list">
                <!-- Events will be populated here -->
            </div>
        </div>
    </div>

    <!-- Mapbox JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    
    <!-- Config -->
    <script src="js/config.js"></script>
    
    <!-- Events Data -->
    <script src="js/events.js"></script>
    
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
